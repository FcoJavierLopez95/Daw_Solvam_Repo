<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="008_Formulariois_Ejercicios.css">
    </head>
    
    <body>
    
        <main>
            <h1>Formulario de Reserva de Viajes</h1>

            <form action="008_Formulariois_Ejercicios.html" method="post">

                <fieldset >
                    
                    <legend>Información Personal</legend>

                    <div >
                        <label for="name">Nombre Completo:</label>
                        <input class= cuad type="text">
                    </div>
        
                    <div >
                        <label for="email">Correo Electrónico:</label>
                        <input class= cuad type="email">
                    </div>
                
                    <div>
                        <label for="phone">Número de Teléfono:</label>
                        <input class= cuad type="text">
                    </div>
                </fieldset>
            
            <Fieldset >
                    <legend>Detalles del Viaje</legend>
                    <div class=inline-block >
                    
                        <label for="Destino">Destino:</label>
                        <select class= date name="Destino" id="Destino">
                            <option value="sel" selected disabled hidden>-- Seleccionar Destino --</option>
                            <option value="jap">Japón</option>
                            <option value="uk">Reino Unido</option>
                            <option value="ind">India</option>
                        </select>
                    </div>
                    <div class=inline-block >
                        <label for="start-date">Fecha de Salida:</label>
                        <input class= "date" type="date">
                    </div>
                    <div class=inline-block >
                        <label for="end-date">Fecha de Regreso:</label>
                        <input class="date" type="date">
                    </div>
            </Fieldset>

                <fieldset class=block>
                    <legend>Preferencias</legend>

                    <fieldset class="inline-block" class="inline-block" >
                        <h3>Clase de Viaje:</h3>
                        <div class=block>
                            <input type="radio" id = "low" name="class">
                            <label for="low">Económica</label>
                        </div>
                        <div  >
                            <input type="radio" id = "high" name="class">
                            <label class=blockfor="high">Ejecutica (Business)</label>
                        </div>
                        <div>
                            <input type="radio" id="premium" name="class">
                            <label for="premium">Primera clase</label>
                        </div>
                    </fieldset >
                    <fieldset class="inline-block">
                        <h3>Servicios Adicionales:</h3>
                        <div>
                            <input type="checkbox" id="asurance" name="serv">
                            <label for="asurance">Seguro de Viaje</label>
                        </div>
                        <div>
                            <input type="checkbox" id="guide" name="serv">
                            <label for="guide">Guía Turísttico</label>
                        </div><div>
                            <input type="checkbox" id="food" name="serv">
                            <label for="food">Plan de Comidas</label>
                        </div>
                    </fieldset >
                </fieldset>
                <fieldset>
                    
                    <legend>Mensaje</legend>
                    <div>
                        <label for="msn">Comentarios o peticiones especiales:</label>
                        <textarea name="msn" id="msn"></textarea>
                    </div>
                </fieldset>

        <div id = "submit">
            <button type="submit">Reservar Ahora</button>
        </div>            

            </form>
    </main>
    
    
    </body>
    
    </html>
