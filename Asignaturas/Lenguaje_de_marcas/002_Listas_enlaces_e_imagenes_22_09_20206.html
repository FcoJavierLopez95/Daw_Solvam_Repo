<body>

<ul>                          <!-- Lista unordered Desordenada -->

  <li>Torrente</li>

</ol>

<!-- ENLACES -->

<h1>ENLACES</h1>
<a href="https://www.solvam.es/" target="_blank" rel="noopener noreferrer">Solvam</a>
<!-- noopener: bloquea que la nueva página controle maliciosamente tu pestaña original. -->
<!-- noreferrer: oculta el origen del tráfico para que el destino no sepa de qué web viene el usuario. -->
<!-- target: decide si el enlace se abre en la pestaña actual o en una nueva. -->

<!-- IMÁGENES -->
 <img src="../../Images/Solvam.jpg" alt="Imagen del escudo de Solvam" width="200" title="Solvam">

</html>
